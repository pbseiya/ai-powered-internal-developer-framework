<p><strong>คำถาม:</strong> &quot;Server ที่มีอยู่จะรองรับงานโรงงานและ Back Office ได้อย่างไร?&quot;</p>

<header>AI-Powered Internal Developer Framework</header>
<h1 id="%F0%9F%93%88-%E0%B8%96%E0%B9%89%E0%B8%B2-resource-%E0%B9%84%E0%B8%A1%E0%B9%88%E0%B9%80%E0%B8%9E%E0%B8%B5%E0%B8%A2%E0%B8%87%E0%B8%9E%E0%B8%AD-%E0%B8%88%E0%B8%B0%E0%B8%88%E0%B8%B1%E0%B8%94%E0%B8%81%E0%B8%B2%E0%B8%A3%E0%B8%AD%E0%B8%A2%E0%B9%88%E0%B8%B2%E0%B8%87%E0%B9%84%E0%B8%A3"><img class="emoji" draggable="false" alt="📈" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/1f4c8.svg" data-marp-twemoji=""/> ถ้า Resource ไม่เพียงพอ จะจัดการอย่างไร?</h1>
<div class="columns">
<div>
<p><strong>Phase 1: Optimize (เดือน 1-3)</strong></p>
<p><strong>1. Right-sizing</strong></p>
<ul>
<li>ตรวจสอบ resource ที่ใช้จริง</li>
<li>ปรับ requests/limits ให้เหมาะสม</li>
<li>ลด waste 20-30%</li>
</ul>
<p><strong>2. Auto-scaling</strong></p>
<ul>
<li>HPA: เพิ่ม pods เมื่อ traffic สูง</li>
<li>VPA: ปรับขนาด pods อัตโนมัติ</li>
<li>ลด resource ตอน traffic ต่ำ</li>
</ul>
<p><strong>3. Priority Management</strong></p>
<ul>
<li>Dev/Test scale down ตอน resource เต็ม</li>
<li>โรงงาน/Back Office ได้ resource เสมอ</li>
</ul>
<p><strong>ผลลัพธ์:</strong> รองรับเพิ่มได้อีก 30-50% โดยไม่ต้องเพิ่ม hardware</p>
</div>
<div>
<p><strong>Phase 2: Scale Out (เดือน 4-6)</strong></p>
<p><strong>ถ้ายังเพียงพอ:</strong></p>
<p><strong>1. เพิ่ม Worker Nodes</strong></p>
<ul>
<li>เพิ่ม server เข้า cluster</li>
<li>k8s กระจาย workload อัตโนมัติ</li>
<li>ไม่ต้อง downtime</li>
</ul>
<p><strong>2. ใช้ Cloud Bursting</strong></p>
<ul>
<li>ใช้ cloud server ชั่วคราว (AWS/GCP)</li>
<li>เฉพาะตอน traffic สูงมาก</li>
<li>ประหยัดกว่าซื้อ server ใหม่</li>
</ul>
<p><strong>3. Edge Computing</strong></p>
<ul>
<li>ย้าย workload บางส่วนไป edge</li>
<li>ลด load ที่ central cluster</li>
<li>เหมาะกับ IoT/factory</li>
</ul>
<p><strong>ผลลัพธ์:</strong> Scale ได้ไม่จำกัด โดยไม่กระทบ service</p>
</div>
</div>
<footer>August 2026</footer>
</section>

<h1 id="%F0%9F%94%80-database-branching-%E0%B9%80%E0%B8%AB%E0%B8%A1%E0%B8%B7%E0%B8%AD%E0%B8%99-neon"><img class="emoji" draggable="false" alt="🔀" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/1f500.svg" data-marp-twemoji=""/> Database Branching: เหมือน Neon</h1>
<p><strong>NeonDB ทำอย่างไร:</strong></p>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code>Developer เปิด PR → สร้าง database branch ใน 1 วินาที
→ รัน tests → ลบ branch เมื่อ PR ปิด
</code></pre>
<p><strong>วิธีของเรา (ทำเหมือนกัน):</strong></p>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code>MR #123 → สร้าง database branch: myapp-mr-123
MR #124 → สร้าง database branch: myapp-mr-124
→ รัน tests → ลบ branch เมื่อ MR ปิด
</code></pre>
<p><strong>GitLab CI/CD Template:</strong></p>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-yaml"><span class="hljs-attr">create-db-branch:</span>
  <span class="hljs-attr">script:</span>
    <span class="hljs-bullet">-</span> <span class="hljs-string">|
      # สร้าง database branch (PostgreSQL)
      DB_BRANCH=&quot;myapp-mr-${CI_MERGE_REQUEST_IID}&quot;
      kubectl exec postgres-0 -- \
        psql -c &quot;CREATE DATABASE ${DB_BRANCH} WITH TEMPLATE myapp_main;&quot;
</span>      
      <span class="hljs-comment"># Inject connection string</span>
      <span class="hljs-string">echo</span> <span class="hljs-string">&quot;DATABASE_URL=postgresql://...&quot;</span> <span class="hljs-string">&gt;&gt;</span> <span class="hljs-string">.env</span>
      
  <span class="hljs-attr">only:</span>
    <span class="hljs-bullet">-</span> <span class="hljs-string">merge_requests</span>

<span class="hljs-attr">cleanup-db-branch:</span>
  <span class="hljs-attr">script:</span>
    <span class="hljs-bullet">-</span> <span class="hljs-string">kubectl</span> <span class="hljs-string">exec</span> <span class="hljs-string">postgres-0</span> <span class="hljs-string">--</span> <span class="hljs-string">psql</span> <span class="hljs-string">-c</span> <span class="hljs-string">&quot;DROP DATABASE ${DB_BRANCH};&quot;</span>
  <span class="hljs-attr">when:</span> <span class="hljs-string">on_success</span>
  <span class="hljs-attr">only:</span>
    <span class="hljs-bullet">-</span> <span class="hljs-string">merge_requests</span>
</code></pre>

<h1 id="%F0%9F%A7%A0-vector-db-%E0%B8%AA%E0%B8%B3%E0%B8%AB%E0%B8%A3%E0%B8%B1%E0%B8%9A-airag"><img class="emoji" draggable="false" alt="🧠" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/1f9e0.svg" data-marp-twemoji=""/> Vector DB สำหรับ AI/RAG</h1>
<p><strong>ปัญหา:</strong> AI applications ต้องการ vector storage สำหรับ embeddings → ต้องรัน vector DB แยก (แพง!)</p>
<p><strong>วิธีแก้: pgvector</strong> - Vector search ใน PostgreSQL เดียวกัน (Free, open-source)</p>
<p><strong>ตัวอย่าง SQL:</strong></p>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-sql"><span class="hljs-keyword">CREATE</span> EXTENSION vector;
<span class="hljs-keyword">CREATE TABLE</span> documents (
  id bigserial <span class="hljs-keyword">PRIMARY KEY</span>,
  content text,
  embedding vector(<span class="hljs-number">1536</span>)  <span class="hljs-comment">-- OpenAI dimension</span>
);
<span class="hljs-keyword">CREATE</span> INDEX <span class="hljs-keyword">ON</span> documents <span class="hljs-keyword">USING</span> ivfflat (embedding vector_cosine_ops);
<span class="hljs-keyword">SELECT</span> content, embedding <span class="hljs-operator">&lt;=&gt;</span> $<span class="hljs-number">1</span> <span class="hljs-keyword">AS</span> distance <span class="hljs-keyword">FROM</span> documents <span class="hljs-keyword">ORDER</span> <span class="hljs-keyword">BY</span> distance LIMIT <span class="hljs-number">10</span>;
</code></pre>
<p><strong>Zero Config:</strong></p>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-yaml"><span class="hljs-attr">include:</span>
  <span class="hljs-bullet">-</span> <span class="hljs-attr">project:</span> <span class="hljs-string">&#x27;platform/db-templates&#x27;</span>
    <span class="hljs-attr">file:</span> <span class="hljs-string">&#x27;/postgresql-pgvector.yml&#x27;</span>
<span class="hljs-attr">variables:</span>
  <span class="hljs-attr">DB_NAME:</span> <span class="hljs-string">myapp-ai</span>
  <span class="hljs-attr">ENABLE_PGVECTOR:</span> <span class="hljs-string">&quot;true&quot;</span>
</code></pre>

<h1 id="%F0%9F%94%90-security--access-control-3-layers-of-rbac"><img class="emoji" draggable="false" alt="🔐" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/1f510.svg" data-marp-twemoji=""/> Security &amp; Access Control: 3 Layers of RBAC</h1>
<div class="highlight">
<p><strong>คำถามสำคัญ:</strong> &quot;Zero Config ปลอดภัยไหม? ทีมอื่นจะ access database/queue ของเราได้ไหม?&quot;</p>
<p><strong>คำตอบ:</strong> <img class="emoji" draggable="false" alt="✅" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/2705.svg" data-marp-twemoji=""/> <strong>ปลอดภัยด้วย 3 Layers ของ RBAC</strong></p>
<ol>
<li><strong>Kubernetes RBAC</strong> — Namespace isolation (ทีม A เข้าไม่ได้ namespace ทีม B)</li>
<li><strong>Database/Queue RBAC</strong> — Credentials per app (app A access ไม่ได้ DB ของ app B)</li>
<li><strong>Portal RBAC</strong> — UI access control (Developer เห็นเฉพาะ app ของตัวเอง)</li>
</ol>
</div>

<h1 id="%F0%9F%94%91-layer-2-databasequeue-rbac-resource-level"><img class="emoji" draggable="false" alt="🔑" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/1f511.svg" data-marp-twemoji=""/> Layer 2: Database/Queue RBAC (Resource Level)</h1>

<div>
<p><strong>RabbitMQ:</strong></p>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code>Shared RabbitMQ Cluster

</code></pre>
<p><strong>SQL Server:</strong></p>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code>Shared SQL Server
├── Database: team_a_app_1
│   └── login: team_a_app_1 (access เฉพาะ DB นี้)
├── Database: team_b_app_1
│   └── login: team_b_app_1
</code></pre>
</div>
<div>
<p><strong>สิ่งที่ต้องทำ:</strong></p>
<ul>
<li><img class="emoji" draggable="false" alt="✅" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/2705.svg" data-marp-twemoji=""/> Auto-generate credentials per app</li>
<li><img class="emoji" draggable="false" alt="✅" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/2705.svg" data-marp-twemoji=""/> Store credentials ใน Vault</li>
<li><img class="emoji" draggable="false" alt="✅" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/2705.svg" data-marp-twemoji=""/> Inject credentials เป็น environment variables</li>
<li><img class="emoji" draggable="false" alt="✅" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/2705.svg" data-marp-twemoji=""/> จำกัดสิทธิ์ (app A access ไม่ได้ DB ของ app B)</li>
</ul>

<pre is="marp-pre" data-auto-scaling="downscale-only"><code>Developer กด &quot;Create Database&quot;

→ Inject เป็น $DATABASE_URL
→ Developer ใช้ได้ทันที
→ ทีมอื่น access ไม่ได้
</code></pre>

<header>AI-Powered Internal Developer Framework</header>
<h1 id="%F0%9F%93%8A-resource-requirements-k8s-cluster"><img class="emoji" draggable="false" alt="📊" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/1f4ca.svg" data-marp-twemoji=""/> Resource Requirements: k8s Cluster</h1>
<div class="columns">
<div>
<p><strong>Minimum Production Cluster:</strong></p>
<p><strong>Control Plane (3 nodes - HA):</strong></p>
<ul>
<li>CPU: 4 cores</li>
<li>RAM: 8 GB</li>
<li>Storage: 100 GB SSD</li>
<li><strong>รวม:</strong> 12 cores, 24 GB RAM</li>
</ul>
<p><strong>Worker Nodes (เริ่มต้น 3 nodes):</strong></p>
<ul>
<li>CPU: 8 cores/node</li>
<li>RAM: 32 GB/node</li>
<li>Storage: 500 GB SSD/node</li>
<li><strong>รวม:</strong> 24 cores, 96 GB RAM</li>
</ul>
<p><strong>รวม Cluster:</strong></p>
<ul>
<li><strong>36 cores, 120 GB RAM</strong></li>
<li><strong>1.6 TB Storage</strong></li>
</ul>
</div>
<div>
<p><strong>Resource per App (โดยประมาณ):</strong></p>
<table>
<thead>
<tr>
<th>App Type</th>
<th>CPU</th>
<th>RAM</th>
<th>Storage</th>
</tr>
</thead>
<tbody>
<tr>
<td><strong>Web App</strong></td>
<td>0.5 core</td>
<td>512 MB</td>
<td>1 GB</td>
</tr>
<tr>
<td><strong>API Service</strong></td>
<td>1 core</td>
<td>1 GB</td>
<td>2 GB</td>
</tr>
<tr>
<td><strong>Database</strong></td>
<td>2 cores</td>
<td>4 GB</td>
<td>50 GB</td>
</tr>
<tr>
<td><strong>Message Queue</strong></td>
<td>1 core</td>
<td>2 GB</td>
<td>10 GB</td>
</tr>
<tr>
<td><strong>AI/ML Service</strong></td>
<td>2 cores</td>
<td>4 GB</td>
<td>5 GB</td>
</tr>
</tbody>
</table>
<p><strong>รองรับได้:</strong></p>
<ul>
<li>10-20 apps (mixed workloads)</li>
<li>50-100 pods</li>

<header>AI-Powered Internal Developer Framework</header>
<h1 id="%F0%9F%93%88-scaling-strategy-up-vs-out"><img class="emoji" draggable="false" alt="📈" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/1f4c8.svg" data-marp-twemoji=""/> Scaling Strategy: Up vs Out</h1>
<div class="columns">
<div>
<p><strong>Scale Up (Vertical Scaling)</strong></p>
<p><strong>เพิ่มทรัพยากรให้ node เดิม:</strong></p>
<ul>
<li>เพิ่ม CPU/RAM ให้ node</li>
<li>ง่าย ไม่ต้องเพิ่ม node ใหม่</li>
<li>เหมาะกับ stateful workloads (database)</li>
</ul>
<p><strong>ข้อดี:</strong></p>
<ul>
<li><img class="emoji" draggable="false" alt="✅" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/2705.svg" data-marp-twemoji=""/> ง่าย เร็ว</li>
<li><img class="emoji" draggable="false" alt="✅" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/2705.svg" data-marp-twemoji=""/> ไม่ต้อง re-architect</li>
<li><img class="emoji" draggable="false" alt="✅" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/2705.svg" data-marp-twemoji=""/> เหมาะกับ database</li>
</ul>
<p><strong>ข้อเสีย:</strong></p>
<ul>
<li><img class="emoji" draggable="false" alt="❌" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/274c.svg" data-marp-twemoji=""/> มีขีดจำกัด (hardware limit)</li>
<li><img class="emoji" draggable="false" alt="❌" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/274c.svg" data-marp-twemoji=""/> Downtime ตอน upgrade</li>
<li><img class="emoji" draggable="false" alt="❌" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/274c.svg" data-marp-twemoji=""/> แพงกว่า (diminishing returns)</li>
</ul>
</div>
<div>
<p><strong>Scale Out (Horizontal Scaling)</strong></p>
<p><strong>เพิ่ม node ใหม่เข้า cluster:</strong></p>
<ul>
<li>เพิ่ม worker nodes</li>
<li>k8s กระจาย workload อัตโนมัติ</li>
<li>เหมาะกับ stateless workloads (web apps)</li>
</ul>
<p><strong>ข้อดี:</strong></p>
<ul>
<li><img class="emoji" draggable="false" alt="✅" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/2705.svg" data-marp-twemoji=""/> ไม่จำกัด (เพิ่มได้เรื่อยๆ)</li>
<li><img class="emoji" draggable="false" alt="✅" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/2705.svg" data-marp-twemoji=""/> No downtime</li>
<li><img class="emoji" draggable="false" alt="✅" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/2705.svg" data-marp-twemoji=""/> ถูกกว่า (commodity hardware)</li>
</ul>
<p><strong>ข้อเสีย:</strong></p>
<ul>
<li><img class="emoji" draggable="false" alt="⚠️" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/26a0.svg" data-marp-twemoji=""/> ต้อง design สำหรับ distributed</li>
<li><img class="emoji" draggable="false" alt="⚠️" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/26a0.svg" data-marp-twemoji=""/> ซับซ้อนกว่า</li>
<li><img class="emoji" draggable="false" alt="⚠️" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/26a0.svg" data-marp-twemoji=""/> ต้องการ load balancer</li>
</ul>
<p><strong>คำแนะนำ:</strong> ใช้ <strong>Scale Out</strong> เป็นหลัก + <strong>Scale Up</strong> สำหรับ database</p>
</div>
</div>

<span class="hljs-attr">kind:</span> <span class="hljs-string">HorizontalPodAutoscaler</span>

<span class="hljs-attr">spec:</span>
  <span class="hljs-attr">scaleTargetRef:</span>
    <span class="hljs-attr">apiVersion:</span> <span class="hljs-string">apps/v1</span>
